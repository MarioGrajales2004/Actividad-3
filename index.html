<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="css/componente.css">
    <script src="js/componente.js"></script>

<body>

    <div class="contenedor-principal">
        <h1>Curiosidades del Metal</h1>
        <p>Selecciona un instrumento para descubrir su historia.</p>

        <div class="botones-lista">
            <button onclick="mostrarNotificacionMetal('guitarra', 'Guitarra Electrica', 'Dave Mustaine popularizo la tecnica del Spider Chord en el thrash metal, evitando ruido entre cuerdas.')">
                Dato de Guitarra
            </button>

            <button onclick="mostrarNotificacionMetal('bajo', 'El Bajo en el Metal', 'Muchos bajistas de heavy metal prefieren tocar con pua para un ataque mas agresivo.')">
                Dato de Bajo
            </button>

            <button onclick="mostrarNotificacionMetal('bateria', 'La Bateria Thrash', 'The Rev utilizaba una tecnica patentada llamada The Double Ride para fills increiblemente rapidos.')">
                Dato de Batería
            </button>

            <button onclick="mostrarNotificacionMetal('teclado', 'Sintetizadores', 'El teclado revoluciono el Power Metal añadiendo atmosferas sinfonicas.')">
                Dato de Teclado
            </button>
        </div>
    </div>
